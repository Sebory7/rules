name: Sync Custom Direct Rules to MRS

on:
  schedule:
    - cron: "30 3 * * *"
    # run at 3:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-custom-direct-mrs
  cancel-in-progress: false
  # Prevent multiple runs from pushing to main at the same time

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Restore existing Mihomo
      # ==========================================
      - name: Restore Mihomo from Cache
        id: mihomo-cache
        uses: actions/cache/restore@v4
        with:
          path: .mihomo
          key: mihomo-linux-amd64-compatible-
          restore-keys: |
            mihomo-linux-amd64-compatible-

      # ==========================================
      # 3. Download Mihomo only if Cache is missing
      # ==========================================
      - name: Download latest Mihomo
        if: steps.mihomo-cache.outputs.cache-matched-key == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p .mihomo
          VERSION=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.tag_name')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "ERROR: Failed to get Mihomo version."
            exit 1
          fi
          echo "Latest Mihomo: $VERSION"
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-compatible-${VERSION}.gz"

          echo "Download URL: $URL"
          curl -fL --retry 3 --retry-delay 2 \
            "$URL" \
            -o .mihomo/mihomo.gz
          test -s .mihomo/mihomo.gz
          gunzip -f .mihomo/mihomo.gz
          chmod +x .mihomo/mihomo
          .mihomo/mihomo -v

      # ==========================================
      # 4. Verify Mihomo
      # ==========================================
      - name: Verify Mihomo
        shell: bash
        run: |
          set -e
          test -x .mihomo/mihomo
          .mihomo/mihomo -v

      # ==========================================
      # 5. Prepare directories
      # ==========================================
      - name: Prepare directories
        shell: bash
        run: |
          set -e
          mkdir -p tmp
          mkdir -p ruleset

      # ==========================================
      # 6. Download Custom-Direct.list
      # ==========================================
      - name: Download Custom-Direct.list
        shell: bash
        run: |
          set -e
          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "https://raw.githubusercontent.com/Sebory7/rules/main/list/Custom-Direct.list" \
            -o tmp/Custom-Direct.list

          test -s tmp/Custom-Direct.list
          echo "Custom-Direct.list downloaded."
          echo "File size:"
          ls -lh tmp/Custom-Direct.list
          echo "First lines:"
          head -20 tmp/Custom-Direct.list

      # ==========================================
      # 7. Convert Custom-list -> MRS
      # ==============Convert Domain Name to a Wildcard==========
      #
      # DOMAIN-SUFFIX,example.com -> +.example.com
      # DOMAIN,example.com -> example.com
      # DOMAIN-KEYWORD,example -> DELETE
      # +.example.com -> +.example.com
      # *.example.com -> *.example.com
      # example.com ->  example.com
      # Comments and empty lines ->  DELETE from MRS input
      #
      # Original comments remain preserved
      # in the downloaded .list file.
      #
      # Other unsupported rules ->  ERROR
      #
      # ==========================================
      - name: Prepare domain rules
        shell: bash
        run: |
          set -e
          rm -f tmp/Custom-Direct.txt
          rm -f ruleset/Custom-Direct.mrs

          awk -F',' '
            {
              # Remove CR from Windows-style line endings
              sub(/\r$/, "", $0)
              # Trim leading/trailing whitespace
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0)
            }

            # ---------Ignore comments--------------
            /^[[:space:]]*#/ {
              next
            }

            # -----------Ignore empty lines---------
            /^[[:space:]]*$/ {
              next
            }
            # ----------------DOMAIN-SUFFIX--------
            # DOMAIN-SUFFIX,example.com -> +.example.com
            # DOMAIN-SUFFIX,example.com,Proxy -> +.example.com
            # --------------------------------------
            $1 == "DOMAIN-SUFFIX" {
              domain = $2
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", domain)
              if (domain == "") {
                print "WARNING: Empty DOMAIN-SUFFIX rule skipped:" > "/dev/stderr"
                print $0 > "/dev/stderr"
                next
              }
              print "+." domain
              next
            }

            # --------------DOMAIN----------------
            # DOMAIN,example.com -> example.com
            # DOMAIN,example.com,DIRECT -> example.com
            # --------------------------------------
            $1 == "DOMAIN" {
              domain = $2
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", domain)
              if (domain == "") {
                print "WARNING: Empty DOMAIN rule skipped:" > "/dev/stderr"
                print $0 > "/dev/stderr"
                next
              }
              print domain
              next
            }

            # -------------DOMAIN-KEYWORD------------
            # DOMAIN-KEYWORD,example -> Delete directly
            # Do NOT convert to wildcard.
            # --------------------------------------
            $1 == "DOMAIN-KEYWORD" {
              print "INFO: Removing DOMAIN-KEYWORD rule:" > "/dev/stderr"
              print $0 > "/dev/stderr"
              next
            }

            # -----------Wildcard suffix domain-------------
            # +.example.com -> +.example.com
            # --------------------------------------
            /^\+\./ {
              print
              next
            }

            # -----------Wildcard domain-------------
            # *.example.com -> *.example.com
            # --------------------------------------
            /^\*\./ {
              print
              next
            }

            # -----------Plain domain--------------
            # example.com -> example.com
            # Also accepts subdomains: www.example.com
            # --------------------------------------
            /^[A-Za-z0-9]/ {
              print
              next
            }

            # -----------Any other rule type----------------
            # Stop the workflow to prevent
            # accidental incorrect conversion.
            # --------------------------------------
            {
              print "ERROR: Unsupported rule:"
              print $0
              exit 1
            }

          ' tmp/Custom-Direct.list > tmp/Custom-Direct.txt
          test -s tmp/Custom-Direct.txt
          echo ""
          echo "=========================================="
          echo "Converted domain text"
          echo "=========================================="
          cat tmp/Custom-Direct.txt
          echo ""
          echo "=========================================="
          echo "Rule count"
          echo "=========================================="
          wc -l tmp/Custom-Direct.txt

      # ==========================================
      # 8. Convert domain text -> MRS
      # ==========================================
      - name: Convert domain text to MRS
        shell: bash
        run: |
          set -e

          .mihomo/mihomo convert-ruleset \
            domain \
            text \
            tmp/Custom-Direct.txt \
            ruleset/Custom-Direct.mrs
          test -s ruleset/Custom-Direct.mrs
          echo "MRS generated successfully."
          ls -lh ruleset/Custom-Direct.mrs

      # ==========================================
      # 9. Validate
      # ==========================================
      - name: Validate MRS
        shell: bash
        run: |
          set -e

          if [ ! -s ruleset/Custom-Direct.mrs ]; then
            echo "ERROR: ruleset/Custom-Direct.mrs is empty or missing!"
            exit 1
          fi
          echo "Custom-Direct.mrs validation passed."
          ls -lh ruleset/Custom-Direct.mrs

      # ==========================================
      # 10. Commit changes
      # ==========================================
      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ruleset/Custom-Direct.mrs
          if git diff --cached --quiet; then
            echo "ruleset/Custom-Direct.mrs has not changed."
            exit 0
          fi
          git commit \
            -m "chore: update Custom-Direct.mrs"

      # ==========================================
      # 11. Sync remote main
      # ============Preventing Git Branch History Conflicts==============
      - name: Sync with remote
        shell: bash
        run: |
          set -e
          git fetch origin main
          git rebase origin/main

      # ==========================================
      # 12. Push
      # ==========================================
      - name: Push changes
        shell: bash
        run: |
          set -e
          git push origin HEAD:main
