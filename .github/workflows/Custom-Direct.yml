name: Sync Loyalsoldier Rules to MRS

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: sync-custom-direct-mrs
  cancel-in-progress: false
  # Add concurrency lock

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Restore existing Mihomo
      # ==========================================
      - name: Restore Mihomo from Cache
        id: mihomo-cache
        uses: actions/cache/restore@v4
        with:
          path: .mihomo
          key: mihomo-linux-amd64-compatible-
          restore-keys: |
            mihomo-linux-amd64-compatible-
      # =======Search for this prefix to find the latest Cache==========

      # 3. Download Mihomo only if Cache is missing
      # ==========================================
      - name: Download latest Mihomo
        if: steps.mihomo-cache.outputs.cache-matched-key == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p .mihomo
          VERSION=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.tag_name')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "ERROR: Failed to get Mihomo version."
            exit 1
          fi
          echo "Latest Mihomo: $VERSION"
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-compatible-${VERSION}.gz"
          echo "Download URL: $URL"
          curl -fL --retry 3 --retry-delay 2 "$URL" -o .mihomo/mihomo.gz
          test -s .mihomo/mihomo.gz
          gunzip -f .mihomo/mihomo.gz
          chmod +x .mihomo/mihomo
          .mihomo/mihomo -v

      # ==========================================
      # 4. Verify Mihomo
      # ==========================================
      - name: Verify Mihomo
        shell: bash
        run: |
          set -e
          test -x .mihomo/mihomo
          .mihomo/mihomo -v

      # ==========================================
      # 5. Prepare directories
      # ==========================================
      - name: Prepare directories
        shell: bash
        run: |
          set -e
          mkdir -p tmp
          mkdir -p ruleset

      # ==========================================
      # 6. Download upstream rule
      # ==========================================
      - name: Download direct.txt
        shell: bash
        run: |
          set -e
          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt" \
            -o tmp/direct.txt
          test -s tmp/direct.txt
          echo "direct.txt downloaded."
          echo "File size:"
          ls -lh tmp/direct.txt
          echo "First lines:"
          head -20 tmp/direct.txt

      # ==========================================
      # 7. Convert TXT -> MRS
      # ==========================================
      - name: Convert direct.txt to MRS
        shell: bash
        run: |
          set -e
          rm -f ruleset/direct.mrs
          .mihomo/mihomo convert-ruleset \
            domain \
            yaml \
            tmp/direct.txt \
            ruleset/direct.mrs
          test -s ruleset/direct.mrs
          echo "MRS generated successfully."
          ls -lh ruleset/direct.mrs

      # ==========================================
      # 8. Validate
      # ==========================================
      - name: Validate MRS
        shell: bash
        run: |
          set -e
          if [ ! -s ruleset/direct.mrs ]; then
            echo "ERROR: ruleset/direct.mrs is empty or missing!"
            exit 1
          fi
          echo "direct.mrs validation passed."
          ls -lh ruleset/direct.mrs

      # ==========================================
      # 9. Commit and push
      # ==========================================
      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ruleset/Custom-Direct.mrs

          if git diff --cached --quiet; then
            echo "ruleset/Custom-Direct.mrs has not changed."
            exit 0
          fi
          git commit \
            -m "chore: update Custom-Direct.mrs"

      # ==========================================
      # 10. Sync remote main
      # ==============Prevent Git branch history conflicts=============
      - name: Sync with remote
        shell: bash
        run: |
          set -e
          git fetch origin main
          git rebase origin/main

      # ==========================================
      # 12. Push
      # ==========================================
      - name: Push changes
        shell: bash
        run: |
          set -e
          git push origin HEAD:main
