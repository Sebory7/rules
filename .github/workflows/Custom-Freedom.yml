name: Sync Custom-Freedom to MRS
on:
  schedule:
    - cron: "31 3 * * *"
    # run at 3:31
  workflow_dispatch:

permissions:
  contents: write

# Prevent multiple runs from pushing to main at the same time
concurrency:
  group: sync-custom-freedom-mrs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Restore existing Mihomo
      # ==========================================
      - name: Restore Mihomo from Cache
        id: mihomo-cache
        uses: actions/cache/restore@v4
        with:
          path: .mihomo
          key: mihomo-linux-amd64-compatible-
          restore-keys: |
            mihomo-linux-amd64-compatible-

      # ==========================================
      # 3. Download Mihomo only if Cache is missing
      # ==========================================
      - name: Download latest Mihomo
        if: steps.mihomo-cache.outputs.cache-matched-key == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p .mihomo
          VERSION=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.tag_name')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "ERROR: Failed to get Mihomo version."
            exit 1
          fi
          echo "Latest Mihomo: $VERSION"
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-compatible-${VERSION}.gz"
          echo "Download URL: $URL"
          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "$URL" \
            -o .mihomo/mihomo.gz
          test -s .mihomo/mihomo.gz
          gunzip -f .mihomo/mihomo.gz
          chmod +x .mihomo/mihomo
          .mihomo/mihomo -v

      # ==========================================
      # 4. Verify Mihomo
      # ==========================================
      - name: Verify Mihomo
        shell: bash
        run: |
          set -e
          test -x .mihomo/mihomo
          .mihomo/mihomo -v

      # ==========================================
      # 5. Prepare directories
      # ==========================================
      - name: Prepare directories
        shell: bash
        run: |
          set -e
          mkdir -p tmp
          mkdir -p ruleset

      # ==========================================
      # 6. Download Custom-Freedom.list
      # ==========================================
      - name: Download Custom-Freedom.list
        shell: bash
        run: |
          set -e
          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "https://raw.githubusercontent.com/Sebory7/rules/main/list/Custom-Freedom.list" \
            -o tmp/Custom-Freedom.list

          test -s tmp/Custom-Freedom.list
          echo "Custom-Freedom.list downloaded."
          echo "File size:"
          ls -lh tmp/Custom-Freedom.list
          echo "First lines:"
          head -20 tmp/Custom-Freedom.list

      # ==========================================
      # 7. Convert Clash rules -> domain text
      # =============Convert Domain Name to a Wildcard=============
      #
      # DOMAIN-SUFFIX -> +.example.com
      # DOMAIN        -> example.com
      # DOMAIN-KEYWORD -> DELETE
      #
      # Comments and empty lines -> DELETE
      # Other unsupported rules -> ERROR
      #
      # ==========================================
      - name: Prepare domain rules
        shell: bash
        run: |
          set -e
          rm -f tmp/Custom-Freedom.txt
          rm -f ruleset/Custom-Freedom.mrs

          awk -F',' '
            # --------------------------------------
            # Ignore comments
            # --------------------------------------
            /^[[:space:]]*#/ {
              next
            }
            # --------------------------------------
            # Ignore empty lines
            # --------------------------------------
            /^[[:space:]]*$/ {
              next
            }
            # --------------------------------------
            # DOMAIN-SUFFIX
            # DOMAIN-SUFFIX,example.com
            # ->
            # +.example.com
            # --------------------------------------
            $1 == "DOMAIN-SUFFIX" {
              if ($2 == "") {
                print "WARNING: Empty DOMAIN-SUFFIX rule skipped:"
                print $0
                next
              }
              print "+." $2
              next
            }
            # --------------------------------------
            # DOMAIN
            # DOMAIN,example.com
            # ->
            # example.com
            # --------------------------------------
            $1 == "DOMAIN" {
              if ($2 == "") {
                print "WARNING: Empty DOMAIN rule skipped:"
                print $0
                next
              }
              print $2
              next
            }
            # --------------------------------------
            # DOMAIN-KEYWORD
            # Delete directly
            #
            # Do NOT convert to wildcard.
            # --------------------------------------
            $1 == "DOMAIN-KEYWORD" {
              print "INFO: Removing DOMAIN-KEYWORD rule:"
              print $0
              next
            }
            # --------------------------------------
            # Any other rule type
            # Stop the workflow to prevent
            # accidental incorrect conversion.
            # --------------------------------------
            {
              print "ERROR: Unsupported rule:"
              print $0
              exit 1
            }

          ' tmp/Custom-Freedom.list > tmp/Custom-Freedom.txt
          test -s tmp/Custom-Freedom.txt
          echo ""
          echo "=========================================="
          echo "Converted domain text"
          echo "=========================================="
          cat tmp/Custom-Freedom.txt
          echo ""
          echo "=========================================="
          echo "Rule count"
          echo "=========================================="
          wc -l tmp/Custom-Freedom.txt

      # ==========================================
      # 8. Convert domain text -> MRS
      # ==========================================
      - name: Convert domain text to MRS
        shell: bash
        run: |
          set -e

          .mihomo/mihomo convert-ruleset \
            domain \
            text \
            tmp/Custom-Freedom.txt \
            ruleset/Custom-Freedom.mrs
          test -s ruleset/Custom-Freedom.mrs
          echo "MRS generated successfully."
          ls -lh ruleset/Custom-Freedom.mrs

      # ==========================================
      # 9. Validate MRS
      # ==========================================
      - name: Validate MRS
        shell: bash
        run: |
          set -e

          if [ ! -s ruleset/Custom-Freedom.mrs ]; then
            echo "ERROR: ruleset/Custom-Freedom.mrs is empty or missing!"
            exit 1
          fi
          echo "Custom-Freedom.mrs validation passed."
          ls -lh ruleset/Custom-Freedom.mrs

      # ==========================================
      # 10. Commit changes
      # ==========================================
      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add ruleset/Custom-Freedom.mrs
          if git diff --cached --quiet; then
            echo "ruleset/Custom-Freedom.mrs has not changed."
            exit 0
          fi
          git commit \
            -m "chore: update Custom-Freedom.mrs"

      # ==========================================
      # 11. Sync remote main
      # ==========================================
      # Prevent Git branch history conflicts
      # ==========================================
      - name: Sync with remote
        shell: bash
        run: |
          set -e
          git fetch origin main
          git rebase origin/main

      # ==========================================
      # 12. Push
      # ==========================================
      - name: Push changes
        shell: bash
        run: |
          set -e
          git push origin HEAD:main
