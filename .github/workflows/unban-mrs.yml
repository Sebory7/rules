name: Sync UnBan Rules to MRS

on:
  schedule:
    - cron: "30 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Prepare directories
      # ==========================================
      - name: Prepare directories
        shell: bash
        run: |
          set -e

          mkdir -p ruleset
          mkdir -p tmp

      # ==========================================
      # 3. Download ACL4SSR UnBan.list
      # ==========================================
      - name: Download UnBan.list
        shell: bash
        run: |
          set -e

          curl -fL \
            "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list" \
            -o tmp/UnBan.list

          test -s tmp/UnBan.list

          echo "========== UnBan.list =========="
          cat tmp/UnBan.list

      # ==========================================
      # 4. Convert ACL4SSR rules
      # ==========================================
      - name: Convert UnBan.list to Mihomo domain format
        shell: bash
        run: |
          set -e

          awk -F',' '
            /^[[:space:]]*DOMAIN-SUFFIX,/ {
              gsub(/\r/, "", $2)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)
              if ($2 != "")
                print "+." $2
              next
            }

            /^[[:space:]]*DOMAIN,/ {
              gsub(/\r/, "", $2)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)
              if ($2 != "")
                print "full:" $2
              next
            }
          ' tmp/UnBan.list > tmp/UnBan.domain.txt

          test -s tmp/UnBan.domain.txt

          echo "========== Converted domain rules =========="
          cat tmp/UnBan.domain.txt

          echo "============================================"
          echo "Rule count:"
          wc -l tmp/UnBan.domain.txt

      # ==========================================
      # 5. Download latest Mihomo
      # ==========================================
      - name: Download Mihomo
        shell: bash
        run: |
          set -e

          curl -fL \
            "https://github.com/MetaCubeX/mihomo/releases/latest/download/mihomo-linux-amd64-compatible.gz" \
            -o tmp/mihomo.gz

          test -s tmp/mihomo.gz

          gunzip -f tmp/mihomo.gz

          chmod +x tmp/mihomo

          echo "========== Mihomo version =========="
          ./tmp/mihomo -v

      # ==========================================
      # 6. Convert domain text to MRS
      # ==========================================
      - name: Convert to MRS
        shell: bash
        run: |
          set -e

          rm -f ruleset/UnBan.mrs

          ./tmp/mihomo convert-ruleset \
            domain \
            text \
            tmp/UnBan.domain.txt \
            ruleset/UnBan.mrs

          test -s ruleset/UnBan.mrs

          echo "========== Generated MRS =========="
          ls -lh ruleset/UnBan.mrs

      # ==========================================
      # 7. Verify MRS
      # ==========================================
      - name: Verify MRS
        shell: bash
        run: |
          set -e

          if [ ! -f ruleset/UnBan.mrs ]; then
            echo "ERROR: UnBan.mrs was not generated."
            exit 1
          fi

          FILE_SIZE=$(stat -c%s ruleset/UnBan.mrs)

          echo "UnBan.mrs size: ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -le 0 ]; then
            echo "ERROR: UnBan.mrs is empty."
            exit 1
          fi

      # ==========================================
      # 8. Cleanup
      # ==========================================
      - name: Cleanup
        shell: bash
        run: |
          rm -rf tmp

      # ==========================================
      # 9. Check changes
      # ==========================================
      - name: Check changes
        id: changes
        shell: bash
        run: |
          git add ruleset/UnBan.mrs

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      # ==========================================
      # 10. Commit
      # ==========================================
      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update UnBan.mrs"

      # ==========================================
      # 11. Push
      # ==========================================
      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git push
