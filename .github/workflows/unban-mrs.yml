name: Sync UnBan Rules to MRS

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Restore Mihomo from Cache
      # ==========================================
      - name: Restore Mihomo from Cache
        id: mihomo-cache
        uses: actions/cache/restore@v4
        with:
          path: .mihomo
          key: mihomo-linux-amd64-compatible-
          restore-keys: |
            mihomo-linux-amd64-compatible-

      # ==========================================
      # 3. Download latest Mihomo if Cache missing
      # ==========================================
      - name: Download latest Mihomo
        if: steps.mihomo-cache.outputs.cache-matched-key == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p .mihomo

          VERSION=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.tag_name')

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "ERROR: Failed to get Mihomo version."
            exit 1
          fi

          echo "Latest Mihomo: $VERSION"

          URL="https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-compatible-${VERSION}.gz"
          echo "Download URL: $URL"

          curl -fL --retry 3 --retry-delay 2 "$URL" -o .mihomo/mihomo.gz

          test -s .mihomo/mihomo.gz
          gunzip -f .mihomo/mihomo.gz
          chmod +x .mihomo/mihomo

          .mihomo/mihomo -v

      # ==========================================
      # 4. Verify Mihomo
      # ==========================================
      - name: Verify Mihomo
        shell: bash
        run: |
          set -e

          test -x .mihomo/mihomo
          .mihomo/mihomo -v

      # ==========================================
      # 5. Prepare directories
      # ==========================================
      - name: Prepare directories
        shell: bash
        run: |
          set -e

          mkdir -p ruleset
          mkdir -p tmp

      # ==========================================
      # 6. Download ACL4SSR UnBan.list
      # ==========================================
      - name: Download UnBan.list
        shell: bash
        run: |
          set -e

          curl -fL \
            "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list" \
            -o tmp/UnBan.list

          test -s tmp/UnBan.list

          echo "========== UnBan.list =========="
          cat tmp/UnBan.list

      # ==========================================
      # 7. Convert ACL4SSR rules
      #    DOMAIN        -> full:example.com
      #    DOMAIN-SUFFIX -> +.example.com
      # ==========================================
      - name: Convert UnBan.list to Mihomo domain format
        shell: bash
        run: |
          set -e

          awk -F',' '
            /^[[:space:]]*DOMAIN-SUFFIX,/ {
              gsub(/\r/, "", $2)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

              if ($2 != "")
                print "+." $2

              next
            }

            /^[[:space:]]*DOMAIN,/ {
              gsub(/\r/, "", $2)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

              if ($2 != "")
                print "full:" $2

              next
            }
          ' tmp/UnBan.list > tmp/UnBan.domain.txt

          test -s tmp/UnBan.domain.txt

          echo "========== Converted rules =========="
          cat tmp/UnBan.domain.txt

          echo "====================================="
          echo "Rule count:"
          wc -l tmp/UnBan.domain.txt

      # ==========================================
      # 8. Convert domain text to MRS
      # ==========================================
      - name: Convert to MRS
        shell: bash
        run: |
          set -e

          rm -f ruleset/UnBan.mrs

          .mihomo/mihomo convert-ruleset \
            domain \
            text \
            tmp/UnBan.domain.txt \
            ruleset/UnBan.mrs

          test -s ruleset/UnBan.mrs

          echo "========== Generated MRS =========="
          ls -lh ruleset/UnBan.mrs

      # ==========================================
      # 9. Verify MRS
      # ==========================================
      - name: Verify MRS
        shell: bash
        run: |
          set -e

          if [ ! -f ruleset/UnBan.mrs ]; then
            echo "ERROR: UnBan.mrs was not generated."
            exit 1
          fi

          FILE_SIZE=$(stat -c%s ruleset/UnBan.mrs)

          echo "UnBan.mrs size: ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -le 0 ]; then
            echo "ERROR: UnBan.mrs is empty."
            exit 1
          fi

      # ==========================================
      # 10. Cleanup
      # ==========================================
      - name: Cleanup
        shell: bash
        run: |
          rm -rf tmp

      # ==========================================
      # 11. Check changes
      # ==========================================
      - name: Check changes
        id: changes
        shell: bash
        run: |
          git add ruleset/UnBan.mrs

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      # ==========================================
      # 12. Commit
      # ==========================================
      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update UnBan.mrs"

      # ==========================================
      # 13. Push
      # ==========================================
      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git push
