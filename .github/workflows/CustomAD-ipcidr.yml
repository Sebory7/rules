name: Sync CustomAD IP Rules to MRS

on:
  schedule:
    - cron: "33 3 * * *"
    # run at 3:33

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-customad-ipcidr-mrs
  cancel-in-progress: false
  # Prevent multiple runs from pushing to main at the same time

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Restore existing Mihomo
      # ==========================================
      - name: Restore Mihomo from Cache
        id: mihomo-cache
        uses: actions/cache/restore@v4
        with:
          path: .mihomo
          key: mihomo-linux-amd64-compatible-
          restore-keys: |
            mihomo-linux-amd64-compatible-

      # ======= Search for this prefix to find the latest Cache ==========
      # ==========================================
      # 3. Download Mihomo only if Cache is missing
      # ==========================================
      - name: Download latest Mihomo
        if: steps.mihomo-cache.outputs.cache-matched-key == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p .mihomo
          VERSION=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.tag_name')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "ERROR: Failed to get Mihomo version."
            exit 1
          fi
          echo "Latest Mihomo: $VERSION"
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-compatible-${VERSION}.gz"

          echo "Download URL: $URL"
          curl -fL --retry 3 --retry-delay 2 \
            "$URL" \
            -o .mihomo/mihomo.gz
          test -s .mihomo/mihomo.gz
          gunzip -f .mihomo/mihomo.gz
          chmod +x .mihomo/mihomo
          .mihomo/mihomo -v

      # ==========================================
      # 4. Verify Mihomo
      # ==========================================
      - name: Verify Mihomo
        shell: bash
        run: |
          set -e
          test -x .mihomo/mihomo
          .mihomo/mihomo -v

      # ==========================================
      # 5. Prepare directories
      # ==========================================
      - name: Prepare directories
        shell: bash
        run: |
          set -e
          mkdir -p tmp
          mkdir -p ruleset

      # ==========================================
      # 6. Download CustomAD-ipcidr.list
      # ==========================================
      - name: Download CustomAD-ipcidr.list
        shell: bash
        run: |
          set -e
          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "https://raw.githubusercontent.com/Sebory7/rules/main/list/CustomAD-ipcidr.list" \
            -o tmp/CustomAD-ipcidr.list

          test -s tmp/CustomAD-ipcidr.list
          echo "CustomAD-ipcidr.list downloaded."
          echo "File size:"
          ls -lh tmp/CustomAD-ipcidr.list
          echo "First lines:"
          head -20 tmp/CustomAD-ipcidr.list

      # ==========================================
      # 7. Prepare IP-CIDR rules
      # ========Convert to Standard CIDR==========
      # Supported input formats:
      # 1. Plain CIDR:  72.145.135.0/24
      #
      # 2. IP-CIDR:
      # IP-CIDR,1.183.100.0/24
      # IP-CIDR,1.183.100.0/24,direct
      # IP-CIDR,1.183.100.0/24,direct,no-resolve
      #
      # 3.YAML list prefix:
      # - IP-CIDR,1.183.100.0/24,direct,no-resolve
      #
      # 4. Inline comments:
      # 1.183.100.0/24 # comment
      # IP-CIDR,1.183.100.0/24,direct,no-resolve # comment
      #
      # Comments and empty lines -> DELETE
      # Rule policy / direct / no-resolve -> DELETE
      #
      # Final output contains ONLY standard CIDR: 1.183.100.0/24
      # IPv4 and IPv6 are both supported.
      # Other unsupported rules -> ERROR
      #
      # ==========================================
      - name: Prepare IP-CIDR rules
        shell: bash
        run: |
          set -e
          rm -f tmp/CustomAD-ipcidr.txt
          rm -f ruleset/CustomAD-ipcidr.mrs

          awk '
            {
              # Remove CR from Windows-style line endings
              sub(/\r$/, "", $0)
              # Trim leading/trailing whitespace
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0)
            }

            # -----------Ignore full-line comments------
            /^[[:space:]]*#/ {
              next
            }

            # -------Ignore empty lines--------
            /^[[:space:]]*$/ {
              next
            }

            # -----------Remove YAML list prefix--------
            # - IP-CIDR,...
            # -> IP-CIDR,...
            # --------------------------------------
            /^-[[:space:]]*IP-CIDR,/ {
              sub(/^[[:space:]]*-[[:space:]]*/, "", $0)
            }

            # -----------Remove inline comments-----
            # Example:
            # IP-CIDR,1.183.100.0/24,direct # comment 
                # -> IP-CIDR,1.183.100.0/24,direct
            # Plain CIDR: 1.183.100.0/24 # comment -> 1.183.100.0/24
            # --------------------------------------
            sub(/[[:space:]]+#.*$/, "", $0)
            # Trim again after removing comments
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0)

            # ----------IP-CIDR rule----------------
            # IP-CIDR,1.183.100.0/24
            # IP-CIDR,1.183.100.0/24,direct
            # IP-CIDR,1.183.100.0/24,direct,no-resolve
            # Only extract the CIDR itself.
            # --------------------------------------
            /^IP-CIDR[[:space:]]*,/ {
              split($0, fields, ",")
              cidr = fields[2]

              # Trim CIDR whitespace
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", cidr)
              if (cidr == "") {
                print "ERROR: Empty IP-CIDR address:" > "/dev/stderr"
                print $0 > "/dev/stderr"
                exit 1
              }
              # Validate IPv4 CIDR
              if (cidr ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\/[0-9]+$/) {
                print cidr
                next
              }
              # Validate IPv6 CIDR
              if (cidr ~ /^[0-9A-Fa-f:]+\/[0-9]+$/) {
                print cidr
                next
              }
              print "ERROR: Invalid IP-CIDR address:" > "/dev/stderr"
              print cidr > "/dev/stderr"
              exit 1
            }

            # ------Plain IPv4 CIDR------------
            # 1.183.100.0/24
            # --------------------------------------
            /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\/[0-9]+$/ {
              print
              next
            }

            # ------Plain IPv6 CIDR------------
            # Example:  2001:db8::/32
            # --------------------------------------
            /^[0-9A-Fa-f:]+\/[0-9]+$/ {
              print
              next
            }

            # ------Unsupported rule----------
            # Stop the workflow to prevent
            # accidental incorrect conversion.
            # --------------------------------------
            {
              print "ERROR: Unsupported IP-CIDR rule:" > "/dev/stderr"
              print $0 > "/dev/stderr"
              exit 1
            }

          ' tmp/CustomAD-ipcidr.list > tmp/CustomAD-ipcidr.txt
          test -s tmp/CustomAD-ipcidr.txt
          echo ""
          echo "=========================================="
          echo "Converted standard CIDR text"
          echo "=========================================="
          cat tmp/CustomAD-ipcidr.txt
          echo ""
          echo "=========================================="
          echo "Rule count"
          echo "=========================================="
          wc -l tmp/CustomAD-ipcidr.txt

      # ==========================================
      # 8. Convert IP-CIDR text -> MRS
      # ==========================================
      - name: Convert IP-CIDR text to MRS
        shell: bash
        run: |
          set -e
          .mihomo/mihomo convert-ruleset \
            ipcidr \
            text \
            tmp/CustomAD-ipcidr.txt \
            ruleset/CustomAD-ipcidr.mrs
          test -s ruleset/CustomAD-ipcidr.mrs
          echo "MRS generated successfully."
          ls -lh ruleset/CustomAD-ipcidr.mrs

      # ==========================================
      # 9. Validate
      # ==========================================
      - name: Validate MRS
        shell: bash
        run: |
          set -e

          if [ ! -s ruleset/CustomAD-ipcidr.mrs ]; then
            echo "ERROR: ruleset/CustomAD-ipcidr.mrs is empty or missing!"
            exit 1
          fi
          echo "CustomAD-ipcidr.mrs validation passed."
          ls -lh ruleset/CustomAD-ipcidr.mrs

      # ==========================================
      # 10. Commit changes
      # ==========================================
      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ruleset/CustomAD-ipcidr.mrs
          if git diff --cached --quiet; then
            echo "ruleset/CustomAD-ipcidr.mrs has not changed."
            exit 0
          fi
          git commit \
            -m "chore: update CustomAD-ipcidr.mrs"

      # ==========================================
      # 11. Sync remote main
      # ============Preventing Git Branch History Conflicts==============
      # ==========================================
      - name: Sync with remote
        shell: bash
        run: |
          set -e
          git fetch origin main
          git rebase origin/main

      # ==========================================
      # 12. Push
      # ==========================================
      - name: Push changes
        shell: bash
        run: |
          set -e
          git push origin HEAD:main

