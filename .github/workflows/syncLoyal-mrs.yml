name: Sync Loyalsoldier Rules to MRS

on:
  schedule:
    - cron: "30 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Download latest Mihomo
      # ==========================================
      - name: Download latest Mihomo
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"

          VERSION=$(curl -fsSL "$API" \
            | jq -r '.tag_name')

          echo "Latest Mihomo: $VERSION"

          URL=$(curl -fsSL "$API" \
            | jq -r '
              .assets[]
              | select(.name | test("linux-amd64-compatible.*gz$"))
              | .browser_download_url
            ' \
            | head -n 1)

          if [ -z "$URL" ]; then
            echo "Could not find Mihomo Linux amd64 compatible release."
            exit 1
          fi

          echo "Download URL:"
          echo "$URL"

          curl -fL "$URL" -o mihomo.gz

          gunzip mihomo.gz

          chmod +x mihomo

          ./mihomo -v

      # ==========================================
      # 3. Download upstream rule
      # ==========================================
      - name: Download direct.txt
        shell: bash
        run: |
          set -e

          curl -fL \
            "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt" \
            -o direct.txt

          echo "direct.txt downloaded."

          echo "File size:"
          ls -lh direct.txt

          echo "First lines:"
          head -20 direct.txt

      # ==========================================
      # 4. Convert TXT -> MRS
      # ==========================================
      - name: Convert direct.txt to MRS
        shell: bash
        run: |
          set -e

          rm -f ruleset/direct.mrs

          ./mihomo convert-ruleset \
            domain \
            yaml \
            tmp/direct.txt \
            ruleset/direct.mrs

          test -s ruleset/direct.mrs
          echo "Conversion completed."

          ls -lh ruleset/direct.mrs

      # ==========================================
      # 5. Validate
      # ==========================================
      - name: Validate MRS
        shell: bash
        run: |
          set -e

          if [ ! -s direct.mrs ]; then
            echo "direct.mrs is empty!"
            exit 1
          fi

          echo "direct.mrs validation passed."

      # ==========================================
      # 6. Commit and push
      # ==========================================
      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add direct.mrs

          if git diff --cached --quiet; then
            echo "direct.mrs has not changed."

            exit 0
          fi

          git commit \
            -m "chore: update direct.mrs"

          git push
