name: Sync fakeipfilter no cn to MRS

on:
  schedule:
    - cron: "41 3 * * *"
    # run at 3:41
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fakeipfilter-no-cn-mrs
  cancel-in-progress: false
  # Prevent multiple runs from pushing to main at the same time

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Restore existing Mihomo
      # ==========================================
      - name: Restore Mihomo from Cache
        id: mihomo-cache
        uses: actions/cache/restore@v4
        with:
          path: .mihomo
          key: mihomo-linux-amd64-compatible-
          restore-keys: |
            mihomo-linux-amd64-compatible-

      # ======= Search for this prefix to find the latest Cache ==========
      # ==========================================
      # 3. Download Mihomo only if Cache is missing
      # ==========================================
      - name: Download latest Mihomo
        if: steps.mihomo-cache.outputs.cache-matched-key == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p .mihomo
          VERSION=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.tag_name')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "ERROR: Failed to get Mihomo version."
            exit 1
          fi
          echo "Latest Mihomo: $VERSION"
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-compatible-${VERSION}.gz"
          echo "Download URL: $URL"
          curl -fL --retry 3 --retry-delay 2 \
            "$URL" \
            -o .mihomo/mihomo.gz
          test -s .mihomo/mihomo.gz
          gunzip -f .mihomo/mihomo.gz
          chmod +x .mihomo/mihomo
          .mihomo/mihomo -v

      # ==========================================
      # 4. Verify Mihomo
      # ==========================================
      - name: Verify Mihomo
        shell: bash
        run: |
          set -e
          test -x .mihomo/mihomo
          .mihomo/mihomo -v

      # ==========================================
      # 5. Prepare directories
      # ==========================================
      - name: Prepare directories
        shell: bash
        run: |
          set -e
          mkdir -p tmp
          mkdir -p ruleset

      # ==========================================
      # 6. Download fakeipfilter-!cn.list
      # ==========================================
      - name: Download fakeipfilter no CN list
        shell: bash
        run: |
          set -e
          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "https://raw.githubusercontent.com/qichiyuhub/rule/refs/heads/main/rules/fakeipfilter-!cn.list" \
            -o 'tmp/fakeipfilter-no-cn.list'

          test -s 'tmp/fakeipfilter-no-cn.list'
          echo "fakeipfilter-!cn.list downloaded."
          echo "File size:"
          ls -lh 'tmp/fakeipfilter-no-cn.list'
          echo "First lines:"
          head -30 'tmp/fakeipfilter-no-cn.list'

      # ==========================================
      # 7. Prepare domain rules
      # ==============Convert Domain Name to a Wildcard==========
      # This source is already a domain-format list.
      #
      # +.example.com -> +.example.com
      # *.example.com -> *.example.com
      # example.com -> example.com
      # time.*.com -> time.*.com
      # *.*.example.com -> *.*.example.com
      #
      # Comments and empty lines -> DELETE from MRS input
      # Original comments remain preserved
      # in the downloaded .list file.
      #
      # Other unsupported rules -> ERROR
      #
      # ==========================================
      - name: Prepare domain rules
        shell: bash
        run: |
          set -e
          rm -f 'tmp/fakeipfilter-no-cn.txt'
          rm -f 'ruleset/fakeipfilter-!cn.mrs'

          awk '
            {
              # Remove CR from Windows-style line endings
              sub(/\r$/, "", $0)
              # Trim leading/trailing whitespace
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0)
            }

            # ------------Ignore comments-------------
            /^[[:space:]]*#/ {
              next
            }

            # ------------Ignore empty lines---------
            /^[[:space:]]*$/ {
              next
            }

            # ---------Wildcard suffix domain-------
            # +.example.com -> +.example.com
            # +.stun.*.* -> +.stun.*.*
            # --------------------------------------
            /^\+\./ {
              print
              next
            }

            # -------------Wildcard domain---------
            # *.example.com -> *.example.com
            # *.square-enix.com -> *.square-enix.com
            # --------------------------------------
            /^\*\./ {
              print
              next
            }

            # -----Other domain / wildcard domain---
            # example.com -> example.com
            # time.*.com -> time.*.com
            # xbox.*.*.microsoft.com
            # *.*.xboxlive.com
            # --------------------------------------
            /^[A-Za-z0-9*]/ {
              print
              next
            }

            # -------Any other rule type--------
            # Stop the workflow to prevent
            # accidental incorrect conversion.
            # --------------------------------------
            {
              print "ERROR: Unsupported rule:"
              print $0
              exit 1
            }

          ' 'tmp/fakeipfilter-no-cn.list' > 'tmp/fakeipfilter-no-cn.txt'
          test -s 'tmp/fakeipfilter-no-cn.txt'
          echo ""
          echo "=========================================="
          echo "Converted domain text"
          echo "=========================================="
          cat 'tmp/fakeipfilter-no-cn.txt'


          echo ""
          echo "=========================================="
          echo "Rule count protection"
          echo "=========================================="
          # ==========================================
          # Count current rules
          # ==========================================
          CURRENT_COUNT=$(wc -l < 'tmp/fakeipfilter-no-cn.txt')
          echo "Current rule count: ${CURRENT_COUNT}"
          # ==========================================
          # Minimum absolute rule count
          # Prevent empty or severely incomplete
          # upstream lists from being converted.
          # ==========================================
          MIN_RULE_COUNT=10
          if [ "$CURRENT_COUNT" -lt "$MIN_RULE_COUNT" ]; then
            echo ""
            echo "ERROR: Current rule count is too low!"
            echo "Current:  ${CURRENT_COUNT}"
            echo "Minimum:  ${MIN_RULE_COUNT}"
            echo ""
            echo "The workflow will stop to prevent"
            echo "an abnormal MRS update."
            exit 1
          fi
          echo "Minimum rule count check passed."

          # ==========================================
          # Compare with previous MRS
          # Previous MRS is taken directly from
          # the current Git HEAD.
          # No .count file is required.
          # ==========================================
          PREVIOUS_MRS='ruleset/fakeipfilter-!cn.mrs'
          PREVIOUS_TXT='tmp/fakeipfilter-previous.txt'
          if git cat-file -e "HEAD:${PREVIOUS_MRS}" 2>/dev/null; then
            echo ""
            echo "Previous MRS found in Git."
            # Extract the previous MRS from Git HEAD
            git show "HEAD:${PREVIOUS_MRS}" > /tmp/fakeipfilter-previous.mrs
            test -s /tmp/fakeipfilter-previous.mrs

            # Convert previous MRS back to text
            .mihomo/mihomo convert-ruleset \
              domain \
              mrs \
              /tmp/fakeipfilter-previous.mrs \
              "$PREVIOUS_TXT"
            test -s "$PREVIOUS_TXT"
            # Count previous rules
            PREVIOUS_COUNT=$(wc -l < "$PREVIOUS_TXT")
            echo "Previous rule count: ${PREVIOUS_COUNT}"

            # ==========================================
            # 70% protection
            # Current rule count must be at least
            # 70% of the previous rule count.
            # ==========================================
            MIN_ALLOWED=$((PREVIOUS_COUNT * 70 / 100))
            echo "Minimum allowed count: ${MIN_ALLOWED}"
            echo "Required ratio: 70%"
            if [ "$CURRENT_COUNT" -lt "$MIN_ALLOWED" ]; then
              echo ""
              echo "=========================================="
              echo "ERROR: Abnormal rule count decrease!"
              echo "=========================================="
              echo "Previous: ${PREVIOUS_COUNT}"
              echo "Current:  ${CURRENT_COUNT}"
              echo "Minimum:  ${MIN_ALLOWED}"
              echo "Allowed ratio: 70%"
              echo ""
              echo "The workflow will stop to prevent"
              echo "an abnormal MRS update."
              exit 1
            fi
            echo ""
            echo "Rule count comparison passed."
            echo "Current / Previous:"
            echo "${CURRENT_COUNT} / ${PREVIOUS_COUNT}"
          else
            echo ""
            echo "No previous MRS found in Git HEAD."
            echo "Skipping historical rule-count comparison."
            echo "Minimum rule count protection remains enabled."
          fi

      # ==========================================
      # 8. Convert domain text -> MRS
      # ==========================================
      - name: Convert domain text to MRS
        shell: bash
        run: |
          set -e

          .mihomo/mihomo convert-ruleset \
            domain \
            text \
            'tmp/fakeipfilter-no-cn.txt' \
            'ruleset/fakeipfilter-!cn.mrs'
          test -s 'ruleset/fakeipfilter-!cn.mrs'
          echo "fakeipfilter-!cn.mrs generated successfully."
          ls -lh 'ruleset/fakeipfilter-!cn.mrs'

      # ==========================================
      # 9. Validate
      # ==========================================
      - name: Validate MRS
        shell: bash
        run: |
          set -e

          if [ ! -s 'ruleset/fakeipfilter-!cn.mrs' ]; then
            echo "ERROR: ruleset/fakeipfilter-!cn.mrs is empty or missing!"
            exit 1
          fi
          echo "fakeipfilter-!cn.mrs validation passed."
          ls -lh 'ruleset/fakeipfilter-!cn.mrs'

      # ==========================================
      # 10. Commit changes
      # ==========================================
      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'ruleset/fakeipfilter-!cn.mrs'
          if git diff --cached --quiet; then
            echo "ruleset/fakeipfilter-!cn.mrs has not changed."
            exit 0
          fi
          git commit \
            -m "chore: update fakeipfilter-!cn.mrs"

      # ==========================================
      # 11. Sync remote main
      # ======Preventing Git Branch History Conflicts=======
      - name: Sync with remote
        shell: bash
        run: |
          set -e
          git fetch origin main
          git rebase origin/main

      # ==========================================
      # 12. Push
      # ==========================================
      - name: Push changes
        shell: bash
        run: |
          set -e
          git push origin HEAD:main
